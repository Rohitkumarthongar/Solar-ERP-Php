<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
</head>
<body>
    <h2>PWA Icon Generator</h2>
    <p>Right-click on each icon and save as the specified filename</p>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; padding: 20px;">
        <div>
            <canvas id="icon72" width="72" height="72"></canvas>
            <p>icon-72x72.png</p>
        </div>
        <div>
            <canvas id="icon96" width="96" height="96"></canvas>
            <p>icon-96x96.png</p>
        </div>
        <div>
            <canvas id="icon128" width="128" height="128"></canvas>
            <p>icon-128x128.png</p>
        </div>
        <div>
            <canvas id="icon144" width="144" height="144"></canvas>
            <p>icon-144x144.png</p>
        </div>
        <div>
            <canvas id="icon152" width="152" height="152"></canvas>
            <p>icon-152x152.png</p>
        </div>
        <div>
            <canvas id="icon192" width="192" height="192"></canvas>
            <p>icon-192x192.png</p>
        </div>
        <div>
            <canvas id="icon384" width="384" height="384"></canvas>
            <p>icon-384x384.png</p>
        </div>
        <div>
            <canvas id="icon512" width="512" height="512"></canvas>
            <p>icon-512x512.png</p>
        </div>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        sizes.forEach(size => {
            const canvas = document.getElementById(`icon${size}`);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(0, 0, size, size);
            
            // Add rounded corners
            ctx.globalCompositeOperation = 'destination-in';
            ctx.beginPath();
            const radius = size * 0.2;
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fill();
            
            ctx.globalCompositeOperation = 'source-over';
            
            // Draw sun icon
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = size * 0.04;
            
            const centerX = size / 2;
            const centerY = size / 2;
            const sunRadius = size * 0.15;
            
            // Sun circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // Sun rays
            const rayLength = size * 0.12;
            const rayCount = 8;
            for (let i = 0; i < rayCount; i++) {
                const angle = (Math.PI * 2 * i) / rayCount;
                const startX = centerX + Math.cos(angle) * (sunRadius + size * 0.05);
                const startY = centerY + Math.sin(angle) * (sunRadius + size * 0.05);
                const endX = centerX + Math.cos(angle) * (sunRadius + size * 0.05 + rayLength);
                const endY = centerY + Math.sin(angle) * (sunRadius + size * 0.05 + rayLength);
                
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
            
            // Auto-download
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon-${size}x${size}.png`;
                a.click();
                URL.revokeObjectURL(url);
            });
        });
    </script>
</body>
</html>
